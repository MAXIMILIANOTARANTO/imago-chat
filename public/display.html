<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imago AI — Display</title>
<style>
:root{color-scheme:dark;--bg:#080b11;--panel:#111723;--line:#263248;--muted:#8793a8;--text:#eef4ff;--accent:#7be5c4;--accent2:#8c9cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#21414b 0,#080b11 55%);color:var(--text);font:14px Inter,system-ui,sans-serif;min-height:100vh}header{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#090d14cc;backdrop-filter:blur(18px)}.brand{font-size:19px;font-weight:800;letter-spacing:.08em}.brand i{font-style:normal;color:var(--accent);font-weight:400}.pill{border:1px solid var(--line);border-radius:99px;padding:7px 11px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px;box-shadow:0 0 12px var(--accent)}main{display:grid;grid-template-columns:300px minmax(360px,1fr) 270px;gap:16px;padding:16px;min-height:calc(100vh - 70px)}.panel,.canvas{border:1px solid var(--line);border-radius:16px;background:#111723e8;box-shadow:0 14px 45px #0003}.panel{padding:18px}.canvas{min-height:calc(100vh - 102px);display:grid;place-items:center;position:relative;overflow:hidden;background-color:#0e141f;background-image:linear-gradient(45deg,#151d2b 25%,transparent 25%),linear-gradient(-45deg,#151d2b 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#151d2b 75%),linear-gradient(-45deg,transparent 75%,#151d2b 75%);background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0}.empty{text-align:center;color:var(--muted}.empty b{display:block;color:var(--text);font-size:20px;margin-bottom:8px}.result{max-width:94%;max-height:88%;border-radius:10px;box-shadow:0 20px 70px #000b;display:none}.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-size:11px;font-weight:700;margin:2px 0 16px}label{display:block;color:#cbd4e3;font-size:12px;margin:14px 0 6px}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:9px;background:#0a0e16;color:var(--text);padding:11px;font:inherit}textarea{height:145px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{width:100%;border:1px solid var(--line);background:#1a2434;color:var(--text);border-radius:9px;padding:11px;font-weight:650;cursor:pointer;margin-top:10px}button:hover{border-color:var(--accent)}button.primary{border:0;background:linear-gradient(135deg,var(--accent),#b1f2d9);color:#062119;box-shadow:0 8px 25px #75e0bf33}.hint{color:var(--muted);font-size:12px;line-height:1.5}.history{display:grid;grid-template-columns:1fr 1fr;gap:8px}.thumb{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}.bar{position:absolute;bottom:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:#0a0e16dd;border:1px solid var(--line);color:var(--muted);font-size:12px}.bar button{width:auto;margin:0;padding:7px 10px}.hidden{display:none!important}@media(max-width:1000px){main{grid-template-columns:1fr}.canvas{min-height:60vh;order:-1}.panel{min-height:auto}}
</style></head>
<body><header><div class="brand">IMAGO <i>AI display</i></div><div class="pill"><span class="dot"></span><span id="mode">POLLINATIONS · WEB</span></div></header>
<main><section class="panel"><div class="eyebrow">Create</div><label for="prompt">Prompt</label><textarea id="prompt" placeholder="Un paisaje futurista al amanecer, cinematográfico, ultra detallado..."></textarea><label for="negative">Prompt negativo <span class="hint">(opcional)</span></label><input id="negative" placeholder="borroso, baja calidad, texto ilegible"><label for="provider">Motor</label><select id="provider"><option value="pollinations">Pollinations · web</option><option value="comfy">ComfyUI · local</option></select><div class="grid"><div><label for="width">Ancho</label><input id="width" type="number" value="1024" min="256" max="2048" step="64"></div><div><label for="height">Alto</label><input id="height" type="number" value="1024" min="256" max="2048" step="64"></div></div><label for="model">Modelo</label><select id="model"><option>flux</option><option>turbo</option></select><button id="generate" class="primary">✦ Generar imagen</button><p id="status" class="hint">Listo. La imagen se procesa según el motor elegido.</p></section><section class="canvas"><div id="empty" class="empty"><b>Tu lienzo creativo</b>Escribí un prompt y generá tu primera imagen.</div><img id="result" class="result" alt="Imagen generada"><div class="bar"><span id="meta">Sin imagen · memoria local activa</span><button id="download" disabled>Descargar</button></div></section><aside class="panel"><div class="eyebrow">Memoria local</div><p class="hint">Tus resultados se registran en este navegador, no en GitHub.</p><button id="clear">Limpiar historial</button><div id="history" class="history"></div><div class="eyebrow" style="margin-top:24px">Presets</div><button class="preset" data-p="Retrato editorial, luz de ventana, fotografía profesional, 85mm">Retrato editorial</button><button class="preset" data-p="Arquitectura brutalista futurista, niebla, luz volumétrica, cinematic">Arquitectura futurista</button><button class="preset" data-p="Ilustración fantástica, bosque bioluminiscente, arte conceptual detallado">Fantasía</button></aside></main>
<script>
const $=id=>document.getElementById(id),state={url:''};const dbp=indexedDB.open('imago-display',1);dbp.onupgradeneeded=e=>e.target.result.createObjectStore('images',{keyPath:'id',autoIncrement:true});const db=()=>dbp.result;
function msg(t,error=false){$('status').textContent=t;$('status').style.color=error?'#ff8994':'var(--muted)'}function url(){const p=$('prompt').value.trim();if(!p)throw Error('Escribí un prompt para comenzar');const q=new URLSearchParams({width:$('width').value,height:$('height').value,model:$('model').value,nologo:'true',seed:String(Math.floor(Math.random()*1e9))});if($('negative').value)q.set('negative_prompt',$('negative').value);return 'https://image.pollinations.ai/prompt/'+encodeURIComponent(p)+'?'+q}
function render(u){state.url=u;$('result').src=u;$('result').style.display='block';$('empty').classList.add('hidden');$('download').disabled=false;$('meta').textContent='Imagen generada · guardada localmente';const tx=db().transaction('images','readwrite');tx.objectStore('images').add({url:u,prompt:$('prompt').value,date:Date.now()});tx.oncomplete=history}
function history(){const r=db().transaction('images').objectStore('images').getAll();r.onsuccess=()=>{$('history').innerHTML='';r.result.slice(-10).reverse().forEach(i=>{const im=document.createElement('img');im.src=i.url;im.className='thumb';im.title=i.prompt;im.onclick=()=>render(i.url);$('history').append(im)})}}
$('generate').onclick=async()=>{try{$('generate').disabled=true;msg('Generando imagen…');const u=url();await new Promise((ok,no)=>{const im=new Image();im.onload=ok;im.onerror=()=>no(Error('El proveedor no respondió. Probá otra vez.'));im.src=u});render(u);msg('Imagen lista')}catch(e){msg(e.message,true)}finally{$('generate').disabled=false}};$('download').onclick=()=>{const a=document.createElement('a');a.href=state.url;a.download='imago.png';a.target='_blank';a.click()};$('provider').onchange=()=>{$('mode').textContent=$('provider').value==='comfy'?'COMFYUI · LOCAL':'POLLINATIONS · WEB';if($('provider').value==='comfy')msg('El display está listo; conectá ComfyUI en 127.0.0.1:8188.')};$('clear').onclick=()=>{db().transaction('images','readwrite').objectStore('images').clear();$('history').innerHTML='';msg('Historial local eliminado')};document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{$('prompt').value=b.dataset.p});history();
</script></body></html>
