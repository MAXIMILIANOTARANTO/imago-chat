<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imago AI</title>
<style>
:root{--bg:#080c12;--panel:#121a26;--line:#2a374b;--text:#eef4ff;--muted:#95a3b8;--accent:#8ef0c9;--danger:#ff9ea6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#294650,#080c12 46%);color:var(--text);font:14px Inter,system-ui,sans-serif}.app{min-height:100vh;display:grid;grid-template-rows:76px 1fr}header{display:flex;justify-content:space-between;align-items:center;padding:0 28px;border-bottom:1px solid var(--line);background:#090d14dd;backdrop-filter:blur(14px)}.brand{font-weight:800;letter-spacing:.14em;text-transform:uppercase}.brand span{color:var(--accent)}.pill{border:1px solid var(--line);border-radius:99px;padding:8px 12px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:7px;box-shadow:0 0 14px var(--accent)}main{display:grid;grid-template-columns:310px minmax(380px,1fr) 280px;gap:16px;padding:16px}.panel{background:#121a26e8;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 16px 55px #0005}.preview{position:relative;display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 108px);overflow:hidden;background-color:#101722;background-image:linear-gradient(45deg,#172131 25%,transparent 25%),linear-gradient(-45deg,#172131 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#172131 75%),linear-gradient(-45deg,transparent 75%,#172131 75%);background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0}.result{display:none;max-width:95%;max-height:84%;border-radius:12px;box-shadow:0 20px 70px #000b;object-fit:contain}.empty{text-align:center;color:var(--muted);line-height:1.6}.empty strong{display:block;color:var(--text);font-size:20px;margin-bottom:6px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;color:var(--muted);font-size:11px;font-weight:800;margin-bottom:14px}label{display:block;color:#dce6f5;font-size:12px;margin:13px 0 6px}textarea,input,select,button{font:inherit}textarea,input,select{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:#090e16;color:var(--text)}textarea{height:130px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.primary,.secondary{width:100%;border-radius:9px;padding:11px;cursor:pointer;font-weight:700}.primary{margin-top:16px;border:0;background:linear-gradient(135deg,var(--accent),#b6f5dc);color:#062219}.secondary{margin-top:9px;border:1px solid var(--line);background:#1a2535;color:var(--text)}button:disabled{opacity:.5;cursor:not-allowed}.status{color:var(--muted);font-size:12px;line-height:1.5;margin-top:12px;min-height:34px}.bar{position:absolute;left:16px;right:16px;bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:#080d14dd;color:var(--muted);font-size:12px}.bar button{width:auto;margin:0;padding:7px 10px}.history{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.thumb{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}.hidden{display:none!important}@media(max-width:980px){main{grid-template-columns:1fr}.preview{min-height:60vh}.app{height:auto}}
</style></head>
<body><div class="app"><header><div class="brand">Imago <span>AI</span></div><div class="pill"><span class="dot"></span><span id="mode">Pollinations · web</span></div></header><main>
<section class="panel"><div class="eyebrow">Crear</div><label for="prompt">Prompt</label><textarea id="prompt" placeholder="Un paisaje futurista al amanecer, cinematográfico..."></textarea><label for="negative">Prompt negativo</label><input id="negative" placeholder="borroso, baja calidad, texto"><label for="provider">Proveedor</label><select id="provider"><option value="pollinations">Pollinations · web</option><option value="local">Imagen cargada · local</option></select><div class="grid"><div><label for="width">Ancho</label><input id="width" type="number" value="1024" min="256" max="2048" step="64"></div><div><label for="height">Alto</label><input id="height" type="number" value="1024" min="256" max="2048" step="64"></div></div><label for="model">Modelo</label><select id="model"><option value="flux">flux</option><option value="turbo">turbo</option></select><button id="generate" class="primary">✦ Generar imagen</button><div id="status" class="status">Listo. Generá una imagen o cargá una desde tu Mac.</div></section>
<section class="panel preview"><div id="empty" class="empty"><strong>Tu lienzo creativo</strong>Generá una imagen o usá “Cargar imagen” para verla aquí.</div><img id="result" class="result" alt="Imagen mostrada"><div class="bar"><span id="meta">Sin imagen todavía</span><div><button id="uploadButton" class="secondary">＋ Cargar imagen</button><input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden"><button id="download" class="secondary" disabled>Descargar</button></div></div></section>
<aside class="panel"><div class="eyebrow">Historial local</div><div class="status" style="margin-top:0">Las imágenes se guardan solo en este navegador.</div><button id="clear" class="secondary">Limpiar historial</button><div id="history" class="history"></div><div class="eyebrow" style="margin-top:22px">Presets</div><button class="secondary preset" data-p="Retrato editorial, luz de ventana, fotografía cinematográfica, 85mm">Retrato editorial</button><button class="secondary preset" data-p="Arquitectura brutalista futurista, niebla, luz volumétrica, cinematográfico">Arquitectura futurista</button><button class="secondary preset" data-p="Bosque bioluminiscente, arte conceptual detallado, atmósfera mística">Bosque mágico</button></aside></main></div>
<script>
const $=id=>document.getElementById(id),state={url:''};let dbPromise=new Promise((resolve,reject)=>{const r=indexedDB.open('imago-ai',1);r.onupgradeneeded=()=>r.result.createObjectStore('images',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
function status(text,error=false){$('status').textContent=text;$('status').style.color=error?'var(--danger)':'var(--muted')}
function showImage(url,label='Imagen lista'){state.url=url;$('result').src=url;$('result').style.display='block';$('empty').classList.add('hidden');$('download').disabled=false;$('meta').textContent=label;saveHistory(url)}
async function saveHistory(url){try{const db=await dbPromise;db.transaction('images','readwrite').objectStore('images').add({url,date:Date.now()});renderHistory()}catch(e){}}
async function renderHistory(){try{const db=await dbPromise;const r=db.transaction('images').objectStore('images').getAll();r.onsuccess=()=>{$('history').innerHTML='';r.result.slice(-8).reverse().forEach(item=>{const img=document.createElement('img');img.className='thumb';img.src=item.url;img.onclick=()=>showImage(item.url,'Imagen del historial');$('history').append(img)})}}catch(e){}}
function pollinationsUrl(){const p=$('prompt').value.trim();if(!p)throw Error('Escribí un prompt primero.');const q=new URLSearchParams({width:$('width').value,height:$('height').value,model:$('model').value,nologo:'true',seed:String(Math.floor(Math.random()*1e9))});if($('negative').value.trim())q.set('negative_prompt',$('negative').value.trim());return 'https://image.pollinations.ai/prompt/'+encodeURIComponent(p)+'?'+q}
$('generate').onclick=async()=>{try{$('generate').disabled=true;status('Generando imagen…');const url=pollinationsUrl();await new Promise((ok,no)=>{const im=new Image();im.onload=ok;im.onerror=()=>no(Error('No se pudo generar. Revisá tu conexión e intentá otra vez.'));im.src=url});showImage(url);status('Imagen lista.')}catch(e){status(e.message,true)}finally{$('generate').disabled=false}};
$('uploadButton').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/'))return status('Elegí un archivo de imagen válido.',true);const url=URL.createObjectURL(file);showImage(url,'Imagen cargada desde tu Mac');status('Imagen cargada correctamente.');$('provider').value='local';$('mode').textContent='Imagen local'};
$('download').onclick=()=>{if(!state.url)return;const a=document.createElement('a');a.href=state.url;a.download='imago-ai.png';a.target='_blank';a.click()};$('clear').onclick=async()=>{const db=await dbPromise;db.transaction('images','readwrite').objectStore('images').clear();$('history').innerHTML='';status('Historial limpiado.')};$('provider').onchange=()=>{$('mode').textContent=$('provider').value==='local'?'Imagen local':'Pollinations · web';status($('provider').value==='local'?'Usá “Cargar imagen” para abrir una imagen de tu Mac.':'Modo web listo para generar.')};document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{$('prompt').value=b.dataset.p});renderHistory();
</script></body></html>
